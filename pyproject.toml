[project]
name = "example"
version = "0.1.0"
description = ""
authors = [
  { name = "duanluan", email = "duanluan@example.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<3.15"
dependencies = [
  "pyyaml>=6.0.3",
  "py7zr>=1.0.0",
  "apscheduler>=3.11.0",
  "pydantic>=2.11.9",
  "pydantic-settings>=2.11.0"
]

[dependency-groups]
build = [
  "pyinstaller>=6.16.0"
]
dev = [
  "pytest>=8.4.2,<9"
]

[tool.setuptools.package-data]
app1 = ["res/*.yml"]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true
